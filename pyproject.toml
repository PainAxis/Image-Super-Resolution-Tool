[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-super-resolution-tool"
version = "0.1.0"
description = "CPU image upscaling with AMD FSR 1.0 EASU/RCAS and NVIDIA FXAA 3.11"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "PainAxis" }]
dependencies = [
    "numpy>=2.2.6,<3",
    "Pillow>=12.3.0,<13",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4,<2",
    "build>=1.3.0,<2",
    "coverage[toml]>=7.15.4,<8",
    "hypothesis>=6.165.10,<7",
    "mypy>=2.3.1,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.4,<1",
]

[project.gui-scripts]
image-super-resolution = "sr_tool.__main__:main"

[project.urls]
Repository = "https://github.com/PainAxis/Image-Super-Resolution-Tool"
Issues = "https://github.com/PainAxis/Image-Super-Resolution-Tool/issues"

[tool.setuptools.packages.find]
include = ["sr_tool*"]

[tool.setuptools.package-data]
sr_tool = ["locale/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sr_tool"]
omit = ["sr_tool/gui/app.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "RUF"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/"]
