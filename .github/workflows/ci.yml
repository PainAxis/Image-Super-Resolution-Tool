name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Repair incomplete Tk installation on Windows Python 3.10
        if: runner.os == 'Windows' && matrix.python-version == '3.10'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy()"
          if ($LASTEXITCODE -eq 0) {
              exit 0
          }

          Write-Warning "The hosted Python tool cache has an incomplete Tk installation; installing an isolated verified copy."
          $installer = Join-Path $env:RUNNER_TEMP "python-3.10.11-amd64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "python-3.10.11-tk"
          Invoke-WebRequest `
              -Uri "https://www.python.org/ftp/python/3.10.11/python-3.10.11-amd64.exe" `
              -OutFile $installer

          $expectedHash = "D8DEDE5005564B408BA50317108B765ED9C3C510342A598F9FD42681CBE0648B"
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($actualHash -ne $expectedHash) {
              throw "Python installer SHA-256 mismatch: $actualHash"
          }

          $process = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList @(
              "/quiet",
              "InstallAllUsers=0",
              "TargetDir=$installDir",
              "AssociateFiles=0",
              "Shortcuts=0",
              "Include_doc=0",
              "Include_launcher=0",
              "Include_pip=1",
              "Include_test=0",
              "Include_tcltk=1",
              "PrependPath=0"
          )
          if ($process.ExitCode -ne 0) {
              throw "Python installer exited with code $($process.ExitCode)"
          }

          $python = Join-Path $installDir "python.exe"
          & $python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy()"
          if ($LASTEXITCODE -ne 0) {
              throw "The isolated Python installation failed the Tk smoke test"
          }

          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $installDir "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Tk and virtual display on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk xvfb
      - name: Install tested dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Test on Ubuntu under Xvfb
        if: runner.os == 'Linux'
        env:
          SR_TOOL_REQUIRE_DISPLAY: "1"
        run: xvfb-run -a python -m coverage run -m pytest
      - name: Test on Windows or macOS
        if: runner.os != 'Linux'
        env:
          SR_TOOL_REQUIRE_DISPLAY: "1"
        run: python -m coverage run -m pytest
      - name: Enforce coverage floor
        run: python -m coverage report
      - name: Audit the Python 3.10 runtime lock
        if: runner.os == 'Linux' && matrix.python-version == '3.10'
        run: python -m pip_audit -r requirements.txt

  quality:
    name: Quality, security and distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Lint for Python 3.10 syntax
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check against Python 3.10
        run: python -m mypy sr_tool run.py
      - name: Static security scan
        run: python -m bandit -q -r sr_tool
      - name: Audit the current runtime lock
        run: python -m pip_audit -r requirements.txt
      - name: Build distributions
        run: python -m build
      - name: Verify distributions
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "import sr_tool; from sr_tool.__main__ import main"
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          source_archive, = glob.glob("dist/*.tar.gz")
          with tarfile.open(source_archive) as archive:
              names = set(archive.getnames())
          root, = {name.split("/", 1)[0] for name in names}
          required_source = {
              "LICENSE",
              "NOTICE",
              "PERFORMANCE.md",
              "README.md",
              "SECURITY.md",
              "benchmarks/benchmark_pipeline.py",
              "requirements-dev.txt",
              "requirements.txt",
              "run.py",
              "tests/test_pipeline.py",
          }
          missing = sorted(
              path for path in required_source if f"{root}/{path}" not in names
          )
          if missing:
              raise SystemExit(f"sdist is missing: {missing}")

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = set(archive.namelist())
          required_wheel_suffixes = {
              "licenses/LICENSE",
              "licenses/NOTICE",
              "sr_tool/locale/en.json",
              "sr_tool/locale/ru.json",
              "sr_tool/locale/zh.json",
          }
          missing = sorted(
              suffix
              for suffix in required_wheel_suffixes
              if not any(name.endswith(suffix) for name in wheel_names)
          )
          if missing:
              raise SystemExit(f"wheel is missing: {missing}")
          PY
